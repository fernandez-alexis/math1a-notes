name: Build All LaTeX Notes
on: [push]

jobs:
  build_all_pdfs:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4

      - name: Compile all separate .tex notes
        uses: xu-cheng/latex-action@v3
        with:
          root_file: "*.tex"
          glob_root_file: true
          continue_on_error: true # Prevents one broken note from stopping the others

      - name: Upload all compiled note PDFs
        uses: actions/upload-artifact@v4
        with:
          name: All-Individual-Notes
          path: "*.pdf"
