
name: Build All LaTeX Notes and Commit PDFs

on: push

permissions:
  contents: write

jobs:
  build_all_pdfs:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4

      - name: Check LaTeX files
        run: |
          echo "Found LaTeX files:"
          find notes -type f -name '*.tex'
      
      - name: Compile note01
        uses: xu-cheng/latex-action@v3
        with:
          root_file: notes/note01/note01.tex
          work_in_root_file_dir: true

      - name: Commit and push compiled PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          find notes -type f -name '*.pdf' -print

          find notes -type f -name '*.pdf' -exec git add -- {} +

          if git diff --cached --quiet; then
            echo "No changes in PDFs to commit."
          else
            git commit -m "Automated update: Compiled note PDFs [skip ci]"
            git push
          fi
